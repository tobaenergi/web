<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90" fill="none">
  <!-- Sun & Solar Cell Icon -->
  <g transform="translate(10, 10)">
    <!-- Sun Ray / Energy Glow -->
    <circle cx="35" cy="35" r="32" fill="#e6f2f6" />
    <!-- Hexagonal Solar Badge -->
    <path d="M35 8 L60 22 L60 48 L35 62 L10 48 L10 22 Z" fill="#004d66" stroke="#4a8ca1" stroke-width="2" stroke-linejoin="round"/>
    <!-- Solar Grid lines -->
    <path d="M10 35 L60 35" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M22 15 L22 55" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M48 15 L48 55" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Energy Bolt Accent -->
    <path d="M38 18 L26 36 L36 36 L32 52 L44 33 L35 33 Z" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="88" y="48" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#004d66" letter-spacing="1">TEN</text>
  <text x="165" y="48" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="600" font-size="30" fill="#4a8ca1" letter-spacing="0.5">Electric</text>
  <text x="90" y="68" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11" fill="#66828f" letter-spacing="3.5">TOBA ENERGI NUSAJAYA</text>
</svg>
